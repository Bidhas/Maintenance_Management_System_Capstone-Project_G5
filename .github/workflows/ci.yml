# =============================================================================
# CMMS - CI/CD pipeline
#
#   Pull request into develop  ->  test  ->  docker build check
#   Merge / push to develop    ->  test  ->  docker build check  ->  deploy
#
# "deploy" only calls Render's Deploy Hook.  Render then builds the Docker image
# itself and swaps the live site over.  The only GitHub secret needed is
# RENDER_DEPLOY_HOOK_URL (Settings > Secrets and variables > Actions).
# Every real application secret (DATABASE_URL, SMTP password, ...) lives ONLY on Render.
# =============================================================================
name: CI/CD

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

# The workflow only reads the repository; it never needs write access.
permissions:
  contents: read

# If two runs start for the same branch, cancel the older one (saves minutes).
# For develop we do NOT cancel in-progress runs, so a deploy is never cut off half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. Run the automated test suite against a throwaway Postgres.
  #    This database exists only for this run and is destroyed afterwards,
  #    so the tests can never touch the live Supabase database.
  # ---------------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cmms_test
        ports: ['5432:5432']
        # Wait until Postgres accepts connections before the steps start
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cmms_test
      DATABASE_SSL: 'false'       # the CI database has no SSL
      GOOGLE_CLIENT_ID: ''        # tests must not depend on a real client ID
      JWT_SECRET: ci-only-secret  # throw-away value, used only inside this run

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Run the automated tests
        run: npm test --prefix server

  # ---------------------------------------------------------------------------
  # 2. Prove the Docker image builds.  This also builds the React client inside
  #    the image, so a broken client build is caught here, before Render sees it.
  # ---------------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image (not pushed anywhere)
        run: docker build -t cmms:ci .

  # ---------------------------------------------------------------------------
  # 3. Deploy.  Runs ONLY for a push to develop (i.e. after a merge) and ONLY if
  #    jobs 1 and 2 passed.  Pull requests never deploy.
  # ---------------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set. Add it in GitHub Settings > Secrets and variables > Actions."
            exit 1
          fi
          # -f fails on HTTP errors, --retry covers a brief Render hiccup.
          # The URL is never echoed, so it does not appear in the logs.
          curl -fsS --retry 3 -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy requested. Watch progress in the Render dashboard (Events tab)."
